server:
  port: 8081

spring:
  application:
    name: BT-PRODUCT-SERVICE
  datasource:
    url: jdbc:postgresql://bt-postgres:5432/postgres
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://service-registry:8761/eureka
